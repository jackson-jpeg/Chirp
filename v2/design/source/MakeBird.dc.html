<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Make your bird</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14233F}a:hover{color:#0B1528}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EAF6FC; font-family: Nunito, system-ui, sans-serif; color: #14233F; display: flex; flex-direction: column; position: relative; overflow: hidden">
<svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs>
<symbol id="bird" viewBox="-180 -120 340 260" overflow="visible">
<path d="M-92 18 C-120 30 -150 52 -172 78 C-160 84 -140 82 -122 72 C-110 64 -96 48 -84 36 Z" fill="var(--tail)"/>
<path d="M-100 22 C-102 -24 -62 -56 -12 -60 C2 -96 36 -112 66 -106 C100 -100 120 -72 116 -42 C112 -14 96 6 92 24 C88 70 46 100 -6 100 C-58 100 -98 70 -100 22 Z" fill="var(--body)"/>
<path d="M40 -98 C30 -120 38 -140 50 -138 C54 -124 54 -110 52 -98 Z M56 -102 C54 -126 66 -142 78 -136 C76 -122 70 -110 64 -100 Z" fill="var(--tuft, transparent)"/>
<path d="M-40 52 C-30 18 20 0 70 6 C86 8 92 24 88 40 C80 76 44 96 -2 96 C-26 96 -44 80 -40 52 Z" fill="var(--belly)"/>
<path d="M8 -84 C26 -108 72 -112 98 -90 C108 -82 114 -70 116 -58 C96 -70 60 -76 30 -70 C20 -72 12 -76 8 -84 Z" fill="var(--cap)"/>
<path d="M-84 6 C-64 -30 -6 -40 34 -14 C46 -6 50 8 44 20 C30 44 -10 56 -48 50 C-70 46 -88 30 -84 6 Z" fill="var(--wing)"/>
<path d="M-62 34 C-40 40 -10 38 18 28 M-70 18 C-44 24 -12 22 22 10 M-70 2 C-48 6 -20 4 6 -6" stroke="#14233F" stroke-width="3.5" fill="none" opacity=".28" stroke-linecap="round"/>
<ellipse cx="76" cy="-26" rx="14" ry="10" fill="#FF8A7A" opacity=".55"/>
<circle cx="74" cy="-56" r="12" fill="#14233F"/><circle cx="78" cy="-60" r="4.2" fill="#FFFFFF"/>
<path d="M-8 96 L-12 124 M22 94 L24 124" stroke="#E07A2E" stroke-width="7" stroke-linecap="round"/>
<path d="M-26 126 C-18 118 -6 118 2 126 M10 126 C18 118 30 118 38 126" stroke="#E07A2E" stroke-width="6" fill="none" stroke-linecap="round"/>
</symbol>
<symbol id="beakClosed" viewBox="0 0 60 40" overflow="visible"><path d="M0 4 C16 6 34 12 44 20 C34 26 16 30 0 30 Z" fill="#FF7A45"/><path d="M0 18 C16 18 30 20 42 20" stroke="#C4502A" stroke-width="2.5" fill="none"/></symbol>
<linearGradient id="scene" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6CC0EC"/><stop offset=".75" stop-color="#B4E1F6"/><stop offset="1" stop-color="#E3F4FB"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6CF"/><stop offset=".5" stop-color="#FFE38A" stop-opacity=".9"/><stop offset="1" stop-color="#FFE38A" stop-opacity="0"/></radialGradient>
</defs></svg>

<header style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 2px">
<p style="margin: 0; font-size: 13px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; color: #3D5170">Joining Ski trip</p>
<h1 style="margin: 0; font-size: 32px; font-weight: 900; letter-spacing: -0.01em">Make your bird</h1>
</header>

<div style="margin: 14px 16px 0; border-radius: 26px; overflow: hidden; box-shadow: 0 10px 30px rgba(20,35,63,0.10)">
<svg width="358" height="200" viewBox="0 0 358 200" role="img" aria-label="Your bird: blue" style="display: block">
<rect width="358" height="200" fill="url(#scene)"/>
<circle cx="179" cy="70" r="140" fill="url(#glow)"/>
<path d="M-4 168 Q 179 192 362 164" stroke="#14233F" stroke-width="4" fill="none" stroke-linecap="round"/>
<g style="--body:#4FA8E8;--belly:#CDE9FA;--cap:#2F8ED6;--wing:#2F8ED6;--tail:#2A7FC2" transform="translate(172 126) scale(0.42)"><use href="#bird" x="-180" y="-120" width="340" height="260"/><use href="#beakClosed" x="112" y="-52" width="60" height="40"/></g>
</svg>
</div>

<div style="margin: 14px 16px 0; display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 20px; background: #FFFFFF">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 900; color: #3D5170">Name</span><input type="text" value="Jackson" style="height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 2px solid #D6E3EC; background: #FFFFFF; font-size: 17px; font-weight: 800; color: #14233F"></label>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 900; color: #3D5170">Feathers</span>
<div style="display: flex; gap: 10px">
<button type="button" aria-label="Blue, selected" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #4FA8E8; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 5px #14233F; padding: 0"></button>
<button type="button" aria-label="Teal" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #2CB7B0; padding: 0"></button>
<button type="button" aria-label="Yellow" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #FFC531; padding: 0"></button>
<button type="button" aria-label="Coral" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #FF8C69; padding: 0"></button>
<button type="button" aria-label="Green" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #6CC49A; padding: 0"></button>
<button type="button" aria-label="Lilac" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #B39DF2; padding: 0"></button>

<button type="button" aria-label="Orange" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #FFA94D; padding: 0"></button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 900; color: #3D5170">Your chirp <span style="font-weight: 700">· plays when you start talking</span></span>
<div style="display: flex; gap: 8px">
<button type="button" style="flex: 1 1 0; min-height: 44px; border-radius: 22px; border: 2px solid #14233F; background: #14233F; color: #FFFFFF; font-size: 15px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5 L12 7 L3 12.5 Z" fill="currentColor"/></svg>Finch</button>
<button type="button" style="flex: 1 1 0; min-height: 44px; border-radius: 22px; border: 2px solid #D6E3EC; background: #FFFFFF; color: #14233F; font-size: 15px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5 L12 7 L3 12.5 Z" fill="currentColor"/></svg>Robin</button>
<button type="button" style="flex: 1 1 0; min-height: 44px; border-radius: 22px; border: 2px solid #D6E3EC; background: #FFFFFF; color: #14233F; font-size: 15px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5 L12 7 L3 12.5 Z" fill="currentColor"/></svg>Wren</button>
</div>
</div>
</div>

<div style="flex-grow: 1"></div>
<div style="padding: 0 20px 40px">
<button type="button" style="width: 100%; height: 56px; border-radius: 28px; border: none; background: #14233F; color: #FFFFFF; font-size: 18px; font-weight: 900">Hop on the line</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
