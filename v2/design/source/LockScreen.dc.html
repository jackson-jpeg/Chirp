<span style="font-size: 13px; font-weight: 900; color: #FFFFFF">Maya</span>

<p style="margin: -6px 0 0; font-size: 100px; font-weight: 700; font-family: system-ui, sans-serif; letter-spacing: -0.03em; line-height: 1.05">9:41</p>
</div>

<div style="flex-grow: 1"></div>

<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 10px; height: 10px; border-radius: 5px; background: #FFC531; box-shadow: 0 0 0 3px #FFF1C2"></span>
<span style="font-size: 13px; font-weight: 900; letter-spacing: 0.02em">Ski trip</span>
<span style="font-size: 13px; font-weight: 700; color: #3D5170">· 3 on the line</span>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="#FFF1C2"/><g style="--body:#FFC531;--belly:#FFE596;--cap:#FFB81C;--tuft:#F2A100;--wing:#F2A100;--tail:#D98A00" transform="translate(21 29) scale(0.14)"><use href="#bird" x="-180" y="-120" width="340" height="260"/><use href="#beakOpen" x="112" y="-52" width="60" height="40"/></g></svg>

<p style="margin: 0; font-size: 15px; font-weight: 700; line-height: 1.35; color: #2B3D5C">“We got a table by the fire. Lodge, second floor…”</p>
</div>
<button type="button" aria-label="Hold to talk" style="flex-shrink: 0; width: 64px; height: 64px; border-radius: 32px; border: none; background: #FFC531; box-shadow: inset 0 -4px 0 #F2A100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0; color: #14233F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
<span style="font-size: 11px; font-weight: 900">Hold</span>
</button>
</div>
</section>
</div>
