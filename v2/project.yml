# ChirpChirps 2.0 (the clean project). Generated by xcodegen; the .xcodeproj is
# not committed. Same bundle ID as 1.0 so 2.0 ships as its update.
#
# Rules this file holds (docs/NEXT.md, docs/audit/AUDIT.md):
# - Never the `audio` background mode (Guideline 2.5.4, 1.0's last rejection).
#   Jackson chose option 1 (docs/audit/BACKGROUND.md): `bluetooth-central` and
#   `bluetooth-peripheral` only, used by App/Sources/App/BluetoothLink.swift.
# - Usage strings only for what 2.0 asks for, and each asked on first use,
#   never at launch (5.1.1(iv)). Speech is asked on the first tap of
#   captions. No camera, photo library or "Always" location strings until a
#   feature that needs them lands.
name: ChirpChirps
options:
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '26.0'
packages:
  ChirpCore:
    path: ChirpCore
  # libopus (BSD) through swift-opus, as 1.0 shipped it. Exact version on
  # purpose: a range lets a build change with no reviewable commit.
  Opus:
    url: https://github.com/alta/swift-opus
    exactVersion: 0.0.2
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    DEVELOPMENT_TEAM: 2MU4PC84GZ
    CODE_SIGN_STYLE: Automatic
targets:
  Chirp:
    type: application
    platform: iOS
    sources:
    - path: App/Sources
    - path: App/Shared
    - path: App/Resources
    - path: App/Assets.xcassets
    dependencies:
    - package: ChirpCore
      product: ChirpCore
    - package: Opus
      product: Opus
    - target: ChirpLive
    # Universal links: a tapped invite (https://chirpchirps.com/join/#k=...) opens
    # the app straight away. The site serves the matching
    # /.well-known/apple-app-site-association (site/.well-known/, site-deploy).
    # The flock key rides in the fragment, which never reaches a server, and
    # ChirpApp's onContinueUserActivity hands the full URL to Router.openInvite.
    # Two committed entitlements files, picked per config below (xcodegen's
    # `entitlements:` block set the path in a way a Release override could not
    # beat, so the first TestFlight archive still asked for Associated Domains).
    scheme:
      # Big Flock, the one purchase, tested locally (docs/proposals/revenue-2.0.md).
      storeKitConfiguration: App/StoreKit/Chirp.storekit
      testTargets:
      - ChirpAppTests
      - ChirpUITests
      - package: ChirpCore/ChirpCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacksonmsanger.chirpchirp
        # iPhone only, here and not just project-wide: xcodegen's per-target
        # default (1,2) won, and App Store Connect refused the first 2.0 upload
        # (90474, iPad multitasking needs every orientation).
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        # The Opus encoder controls (FEC, bitrate): App/Sources/App/Audio/opus_ctl_shim.c
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/App/Audio/Chirp-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: App/Chirp.entitlements
      # TestFlight and App Store archives (`ios ship chirp`, v2/fastlane): signed
      # with the match AppStore profiles, as 1.0 was (no Xcode account on the Mac).
      # Those profiles have no Associated Domains, so Release uses an entitlements
      # file without it until the App ID gains the capability and match renews the
      # profile (docs/NEXT.md, universal links). Debug keeps applinks.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": match AppStore com.jacksonmsanger.chirpchirp
          CODE_SIGN_ENTITLEMENTS: App/Chirp-Release.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ChirpChirps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Morning
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        UIAppFonts:
        - Nunito.ttf
        NSMicrophoneUsageDescription: ChirpChirps uses the microphone only while you hold to talk.
        NSLocalNetworkUsageDescription: ChirpChirps talks to your friends' phones nearby, with no signal needed.
        NSBonjourServices:
        - _chirpchirps._tcp
        - _chirpchirps._udp
        NSLocationWhenInUseUsageDescription: When you check in, your flock sees where you are for 15 minutes. You are asked every time.
        NSSpeechRecognitionUsageDescription: Captions turn what your friends say into text. They are made on your phone, and your voice is never sent anywhere for them.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
        - CFBundleURLName: com.jacksonmsanger.chirpchirp
          CFBundleURLSchemes:
          - chirpchirps
        NSBluetoothAlwaysUsageDescription: ChirpChirps uses Bluetooth so texts, roll calls and help from your friends reach you with your phone locked.
        # Option 1 (docs/audit/BACKGROUND.md): Bluetooth only, for BluetoothLink.swift. Never `audio` (2.5.4).
        UIBackgroundModes:
        - bluetooth-central
        - bluetooth-peripheral
        NSNearbyInteractionUsageDescription: Find shows which way a friend is and how far, only while you have Find open.
  # The Lock Screen and Dynamic Island card (item 7): a widget extension with
  # only the Live Activity. Shares the bird drawing and tokens with the app.
  ChirpLive:
    type: app-extension
    platform: iOS
    sources:
    - path: App/Widget
    - path: App/Shared
    - path: App/Sources/Design/Bird.swift
    - path: App/Sources/Design/BirdPaths.swift
    - path: App/Sources/Design/Theme.swift
    - path: App/Resources/Fonts/Nunito.ttf
      buildPhase: resources
    dependencies:
    - package: ChirpCore
      product: ChirpCore
    - sdk: WidgetKit.framework
    - sdk: SwiftUI.framework
    settings:
      base:
        # The App ID registered for 1.0's Live Activity, which has a match
        # AppStore profile (".live" has neither).
        PRODUCT_BUNDLE_IDENTIFIER: com.jacksonmsanger.chirpchirp.live-activity
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": match AppStore com.jacksonmsanger.chirpchirp.live-activity
    info:
      path: App/Widget/Info.plist
      properties:
        CFBundleDisplayName: ChirpChirps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
        - Nunito.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # App-hosted unit tests for code that lives in the app, not ChirpCore:
  # `VoiceEngineIsolationTests` calls the callbacks iOS runs off the main queue
  # (the 2.0.0 hold-to-talk crash). `ios test chirp --only ChirpAppTests`.
  ChirpAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: App/Tests
    dependencies:
    - target: Chirp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacksonmsanger.chirpchirp.apptests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Chirp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Chirp
        BUNDLE_LOADER: $(TEST_HOST)
  # Build-vs-design screenshots (App/UITests/BuildVsDesignTests.swift), run
  # through `ios test chirp --only ChirpUITests --env SCREENSHOT_DIR=...`.
  ChirpUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - path: App/UITests
    dependencies:
    - target: Chirp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacksonmsanger.chirpchirp.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Chirp
