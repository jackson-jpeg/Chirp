# ChirpChirps 2.0 (the clean project). Generated by xcodegen; the .xcodeproj is
# not committed. Same bundle ID as 1.0 so 2.0 ships as its update.
#
# Rules this file holds (docs/NEXT.md, docs/audit/AUDIT.md):
# - No UIBackgroundModes, ever (Guideline 2.5.4, 1.0's last rejection).
# - Usage strings only for what 2.0 asks for, and each asked on first use,
#   never at launch (5.1.1(iv)). No camera, photo library, speech or "Always"
#   location strings until a feature that needs them lands.
name: ChirpChirps
options:
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '26.0'
packages:
  ChirpCore:
    path: ChirpCore
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    DEVELOPMENT_TEAM: 2MU4PC84GZ
    CODE_SIGN_STYLE: Automatic
targets:
  Chirp:
    type: application
    platform: iOS
    sources:
    - path: App/Sources
    - path: App/Resources
    - path: App/Assets.xcassets
    dependencies:
    - package: ChirpCore
      product: ChirpCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacksonmsanger.chirpchirp
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ChirpChirps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Morning
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        UIAppFonts:
        - Nunito.ttf
        NSMicrophoneUsageDescription: ChirpChirps uses the microphone only while you hold to talk.
        NSLocalNetworkUsageDescription: ChirpChirps talks to your friends' phones nearby, with no signal needed.
        NSBonjourServices:
        - _chirpchirps._tcp
        - _chirpchirps._udp
        NSLocationWhenInUseUsageDescription: When you check in, your friends see where you are for 15 minutes. You are asked every time.
        NSNearbyInteractionUsageDescription: Find shows which way a friend is and how far, only while you have Find open.
