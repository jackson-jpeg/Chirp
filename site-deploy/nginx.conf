# /etc/nginx/sites-available/chirpchirps: static site from /root/chirpchirps-site.
# Versioned in /root/Chirp/site-deploy/ since 2026-11-17 (before that it lived only on the box).
# Installed by site-deploy/deploy.sh, which checks it with nginx -t and puts the old one back on failure.
# The 443 and redirect blocks are certbot's; keep them as they are.
server {
    server_name chirpchirps.com www.chirpchirps.com;

    # One host: www answered the whole site as a second copy (site audit,
    # 2026-11-17). The sitemap and canonical name chirpchirps.com.
    if ($host = www.chirpchirps.com) {
        return 301 https://chirpchirps.com$request_uri;
    }

    root /root/chirpchirps-site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Universal links for invites (site/.well-known/). Apple's CDN fetches this
    # with no redirect allowed, and wants it as JSON despite the bare name.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    # The release list (site-deploy/signup/): one POST, rate limited per address.
    location = /api/signup {
        limit_req zone=chirp_signup burst=4 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:3330;
        proxy_set_header Host $host;
    }
    location /api/ { return 404; }

    # Cache static assets
    location ~* \.(css|js|png|jpg|ico|svg|woff2|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    listen [2a02:4780:4:1c0b::1]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 187.77.218.14:443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chirpchirps.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chirpchirps.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    include snippets/umami-collector.conf; # visitor analytics, /root/vps-tools/systemd/umami (2026-11-14)


}
server {
    if ($host = www.chirpchirps.com) {
        return 301 https://chirpchirps.com$request_uri;
    } # managed by Certbot (target changed to the one host, 2026-11-17)


    if ($host = chirpchirps.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 187.77.218.14:80;
    listen [2a02:4780:4:1c0b::1]:80;
    server_name chirpchirps.com www.chirpchirps.com;
    return 404; # managed by Certbot




}
