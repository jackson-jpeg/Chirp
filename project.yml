name: ChirpChirp
options:
  bundleIdPrefix: com.chirpchirp
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '26.0'
# Dependencies are pinned to EXACT versions, not `from:` ranges.
#
# This project is generated by xcodegen, so the .xcodeproj — and the
# Package.resolved inside it — is gitignored and rebuilt on every build. That
# makes project.yml the only committed record of dependency versions, and a
# `from:` range means a shipped build can change behaviour with no code change.
# Observed drift under the previous ranges: GRDB 7.0.0 -> 7.10.0,
# MapLibre 6.9.0 -> 6.25.0, Opus 0.0.1 -> 0.0.2.
#
# To upgrade: change the version here, rebuild, and test. That is a reviewable
# commit, which is the point.
packages:
  Opus:
    url: https://github.com/alta/swift-opus
    exactVersion: 0.0.2
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.10.0
  MapLibreNative:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.25.0
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    INFOPLIST_FILE: Chirp/Info.plist
    CODE_SIGN_ENTITLEMENTS: Chirp/Chirp.entitlements
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    DEVELOPMENT_TEAM: 2MU4PC84GZ
    CODE_SIGN_STYLE: Automatic
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    GCC_GENERATE_DEBUGGING_SYMBOLS: true
    SWIFT_COMPILATION_MODE: singlefile
targets:
  Chirp:
    type: application
    platform: iOS
    sources:
    - path: Chirp/Sources
    - path: Chirp/Resources
    dependencies:
    - package: Opus
      product: Opus
    - package: GRDB
      product: GRDB
    - package: MapLibreNative
      product: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacksonmsanger.chirpchirp
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: false
        SWIFT_OBJC_BRIDGING_HEADER: Chirp/Sources/Services/Audio/Chirp-Bridging-Header.h
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 2MU4PC84GZ
      configs:
        Debug:
          CODE_SIGN_IDENTITY: 'Apple Development: Created via API (PJ8D2LN86F)'
          PROVISIONING_PROFILE_SPECIFIER: match Development com.jacksonmsanger.chirpchirp
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.jacksonmsanger.chirpchirp
    info:
      path: Chirp/Info.plist
      properties:
        CFBundleDisplayName: ChirpChirps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        # iPhone-only + portrait-only still trips altool's iPad-multitasking
        # orientation check (90474) unless the app opts out of multitasking.
        UIRequiresFullScreen: true
        NSMicrophoneUsageDescription: ChirpChirps uses the microphone so you can talk to nearby people with push-to-talk and record voice messages for them.
        NSCameraUsageDescription: ChirpChirps uses the camera when you tap the camera button in a chat, so you can take a photo and send it to people nearby.
        NSPhotoLibraryAddUsageDescription: ChirpChirps saves a photo someone nearby sent you to your library when you tap Save on it.
        # AES-GCM under a shared channel key -- standard algorithms from Apple's
        # OS (CryptoKit) only, which self-classifies as exempt. The key is
        # "uses NON-exempt encryption", so exempt usage is declared false;
        # true requires an ITSEncryptionExportComplianceCode from approved
        # export documentation and altool rejects the upload without one.
        ITSAppUsesNonExemptEncryption: false
        NSSpeechRecognitionUsageDescription: ChirpChirps uses on-device speech recognition to show live captions of what nearby people say over push-to-talk.
        # Location is foreground-only and per-check-in. There is deliberately
        # NO NSLocationAlwaysAndWhenInUseUsageDescription: the app has no
        # background location use, and a purpose string for a capability the
        # binary does not exercise is a 5.1.2 finding waiting to happen.
        NSLocationWhenInUseUsageDescription: ChirpChirps shares your position on the map only for a check-in you start by hand. Each check-in lasts 15 minutes, is sent directly to nearby devices, and never resumes on its own.
        NSLocalNetworkUsageDescription: ChirpChirps uses your local network to connect directly to nearby phones over Wi-Fi for push-to-talk and messages, without the internet.
        NSBluetoothAlwaysUsageDescription: ChirpChirps uses Bluetooth to find nearby people running ChirpChirps and connect to them directly for push-to-talk and messages.
        # Push-to-talk keeps receiving and playing audio while backgrounded.
        # Listed here because this file generates the Info.plist; dropping it
        # would silently kill background receive.
        UIBackgroundModes:
        - audio
        NSBonjourServices:
        - _chirp-ptt._udp
        - _chirp-ptt._tcp
  ChirpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: ChirpTests
    dependencies:
    - target: Chirp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacksonmsanger.chirpchirp.tests
  # Device automation. Runs ONLY on physical hardware — it drives the real PTT
  # button on a real radio. Deliberately in its own target and its own scheme so
  # that `ios test chirp` (simulator, unit) is completely unaffected: a UI test
  # bundle in the Chirp scheme would make every simulator run try to launch an
  # app and fail.
  #
  # Signing: Manual, against a match-managed Development profile, exactly like
  # the app. Automatic was tried first and cannot work here — there is no Xcode
  # account on this Mac (signing is App Store Connect API key + match), so
  # `-allowProvisioningUpdates` fails with "No Accounts: Add a new account in
  # Accounts settings". The runner's bundle ID is therefore registered in
  # fastlane/Matchfile and `ios certs refresh chirp` mints its profile.
  ChirpUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - path: ChirpUITests
    dependencies:
    - target: Chirp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacksonmsanger.chirpchirp.uitests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: 'Apple Development: Created via API (PJ8D2LN86F)'
        PROVISIONING_PROFILE_SPECIFIER: match Development com.jacksonmsanger.chirpchirp.uitests.xctrunner
        CODE_SIGN_ENTITLEMENTS: ''
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: ''
        TEST_TARGET_NAME: Chirp
schemes:
  Chirp:
    build:
      targets:
        Chirp: all
        ChirpTests: [test]
    # Without this `test:` block the generated scheme has an empty <Testables>
    # element, so `xcodebuild test` runs ZERO tests while still reporting
    # success. The ChirpTests target was built but unreachable; the ship lane
    # never ran it. Do not remove.
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ChirpTests
    run:
      config: Debug
    archive:
      config: Release
  # Separate scheme, physical devices only. See the ChirpUITests target comment.
  ChirpDeviceTests:
    build:
      targets:
        Chirp: all
        ChirpUITests: [test]
    test:
      config: Debug
      targets:
        - ChirpUITests
    run:
      config: Debug
