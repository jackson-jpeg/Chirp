name: ChirpChirp
options:
  bundleIdPrefix: com.chirpchirp
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '26.0'
# Dependencies are pinned to EXACT versions, not `from:` ranges.
#
# This project is generated by xcodegen, so the .xcodeproj — and the
# Package.resolved inside it — is gitignored and rebuilt on every build. That
# makes project.yml the only committed record of dependency versions, and a
# `from:` range means a shipped build can change behaviour with no code change.
# Observed drift under the previous ranges: GRDB 7.0.0 -> 7.10.0,
# MapLibre 6.9.0 -> 6.25.0, Opus 0.0.1 -> 0.0.2.
#
# To upgrade: change the version here, rebuild, and test. That is a reviewable
# commit, which is the point.
packages:
  Opus:
    url: https://github.com/alta/swift-opus
    exactVersion: 0.0.2
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.10.0
  MapLibreNative:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.25.0
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    INFOPLIST_FILE: Chirp/Info.plist
    CODE_SIGN_ENTITLEMENTS: Chirp/Chirp.entitlements
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    DEVELOPMENT_TEAM: 2MU4PC84GZ
    CODE_SIGN_STYLE: Automatic
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    GCC_GENERATE_DEBUGGING_SYMBOLS: true
    SWIFT_COMPILATION_MODE: singlefile
targets:
  Chirp:
    type: application
    platform: iOS
    sources:
    - path: Chirp/Sources
    - path: Chirp/Resources
    dependencies:
    - package: Opus
      product: Opus
    - package: GRDB
      product: GRDB
    - package: MapLibreNative
      product: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacksonmsanger.chirpchirp
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: false
        SWIFT_OBJC_BRIDGING_HEADER: Chirp/Sources/Services/Audio/Chirp-Bridging-Header.h
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 2MU4PC84GZ
      configs:
        Debug:
          CODE_SIGN_IDENTITY: 'Apple Development: Created via API (PJ8D2LN86F)'
          PROVISIONING_PROFILE_SPECIFIER: match Development com.jacksonmsanger.chirpchirp
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.jacksonmsanger.chirpchirp
    info:
      path: Chirp/Info.plist
      properties:
        CFBundleDisplayName: ChirpChirps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: ChirpChirps uses your microphone for real-time
          voice communication with nearby devices.
        NSCameraUsageDescription: ChirpChirps uses your camera to capture and share
          media with nearby devices.
        NSPhotoLibraryAddUsageDescription: ChirpChirps saves received images to your
          photo library.
        # AES-GCM under a shared channel key -- Apple OS-provided crypto only,
        # qualifies as exempt, but the key must still be declared true.
        ITSAppUsesNonExemptEncryption: true
        NSSpeechRecognitionUsageDescription: ChirpChirps uses on-device speech recognition
          to show live transcripts of incoming voice transmissions.
        NSLocationWhenInUseUsageDescription: ChirpChirps uses your location to share
          your position on the map with nearby peers.
        NSLocalNetworkUsageDescription: ChirpChirps uses your local network to connect
          directly to nearby devices without internet.
        NSBonjourServices:
        - _chirp-ptt._udp
        - _chirp-ptt._tcp
  ChirpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: ChirpTests
    dependencies:
    - target: Chirp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacksonmsanger.chirpchirp.tests
  # Device automation. Runs ONLY on physical hardware — it drives the real PTT
  # button on a real radio. Deliberately in its own target and its own scheme so
  # that `ios test chirp` (simulator, unit) is completely unaffected: a UI test
  # bundle in the Chirp scheme would make every simulator run try to launch an
  # app and fail.
  #
  # Signing: Manual, against a match-managed Development profile, exactly like
  # the app. Automatic was tried first and cannot work here — there is no Xcode
  # account on this Mac (signing is App Store Connect API key + match), so
  # `-allowProvisioningUpdates` fails with "No Accounts: Add a new account in
  # Accounts settings". The runner's bundle ID is therefore registered in
  # fastlane/Matchfile and `ios certs refresh chirp` mints its profile.
  ChirpUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - path: ChirpUITests
    dependencies:
    - target: Chirp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacksonmsanger.chirpchirp.uitests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: 'Apple Development: Created via API (PJ8D2LN86F)'
        PROVISIONING_PROFILE_SPECIFIER: match Development com.jacksonmsanger.chirpchirp.uitests.xctrunner
        CODE_SIGN_ENTITLEMENTS: ''
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: ''
        TEST_TARGET_NAME: Chirp
schemes:
  Chirp:
    build:
      targets:
        Chirp: all
        ChirpTests: [test]
    # Without this `test:` block the generated scheme has an empty <Testables>
    # element, so `xcodebuild test` runs ZERO tests while still reporting
    # success. The ChirpTests target was built but unreachable; the ship lane
    # never ran it. Do not remove.
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ChirpTests
    run:
      config: Debug
    archive:
      config: Release
  # Separate scheme, physical devices only. See the ChirpUITests target comment.
  ChirpDeviceTests:
    build:
      targets:
        Chirp: all
        ChirpUITests: [test]
    test:
      config: Debug
      targets:
        - ChirpUITests
    run:
      config: Debug
